name: Build, Test and Publish to NuGet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'JSdotNet.Project.Guidelines.slnx'
  PROJECT_PATH: 'src/JSdotNet.Project.Guidelines.McpServer/JSdotNet.Project.Guidelines.McpServer.csproj'
  TEST_PROJECT_PATH: 'tests/JSdotNet.Project.Guidelines.McpServer.Tests/JSdotNet.Project.Guidelines.McpServer.Tests.csproj'

permissions:
  contents: write
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.4.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Display GitVersion outputs
        run: |
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.fullSemVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true

      - name: Run tests
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverlet.runsettings
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '80 90'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Pack NuGet package
        run: dotnet pack "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output ./artifacts /p:PackageVersion=${{ steps.gitversion.outputs.fullSemVer }} /p:Version=${{ steps.gitversion.outputs.fullSemVer }}

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Write deployment summary
        run: |
          echo "## 📦 NuGet Package Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`JSdotNet.Project.Guidelines.McpServer\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.gitversion.outputs.fullSemVer }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **NuGet** | [View on NuGet.org](https://www.nuget.org/packages/JSdotNet.Project.Guidelines.McpServer/${{ steps.gitversion.outputs.fullSemVer }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ steps.gitversion.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package JSdotNet.Project.Guidelines.McpServer --version ${{ steps.gitversion.outputs.fullSemVer }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Release v${{ steps.gitversion.outputs.semVer }}
          body: |
            ## 📦 JSdotNet.Project.Guidelines.McpServer `${{ steps.gitversion.outputs.fullSemVer }}`

            ### Install
            ```
            dotnet add package JSdotNet.Project.Guidelines.McpServer --version ${{ steps.gitversion.outputs.fullSemVer }}
            ```

            ### NuGet
            [View on NuGet.org](https://www.nuget.org/packages/JSdotNet.Project.Guidelines.McpServer/${{ steps.gitversion.outputs.fullSemVer }})

            ### Build info
            | | |
            |---|---|
            | **Full SemVer** | `${{ steps.gitversion.outputs.fullSemVer }}` |
            | **Commit** | `${{ steps.gitversion.outputs.sha }}` |
          draft: false
          prerelease: ${{ steps.gitversion.outputs.preReleaseLabel != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NuGet package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: JSdotNet.Project.Guidelines.McpServer.${{ steps.gitversion.outputs.fullSemVer }}
          path: ./artifacts/*.nupkg
          retention-days: 90

  report-failure:
    name: Report Pipeline Failure
    needs: [build-test-publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BODY: |
            ## 🔴 Pipeline Failure: ${{ github.workflow }}

            | | |
            |---|---|
            | **Workflow** | ${{ github.workflow }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Branch** | `${{ github.ref_name }}` |
            | **Commit** | `${{ github.sha }}` |
            | **Triggered by** | ${{ github.actor }} |

            Please [inspect the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
        run: |
          echo "$BODY" | gh issue create \
            --repo "$GH_REPO" \
            --title "⚠️ Pipeline failure: ${{ github.workflow }} #${{ github.run_number }}" \
            --body-file - \
            --label "bug"
