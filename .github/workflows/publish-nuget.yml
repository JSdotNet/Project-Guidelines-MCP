name: Build, Test and Publish to NuGet

on:
  push:
    branches:
      - main
  # A merge the auto-merge workflow makes with GITHUB_TOKEN starts no push run, so that workflow
  # dispatches this one with `since` set to the base commit before the merge. A dispatch without
  # `since` publishes every package, the retired notices included.
  workflow_dispatch:
    inputs:
      since:
        description: 'Publish only the packages changed since this commit; empty publishes every package'
        required: false
        default: ''

env:
  DOTNET_VERSION: '11.0.x'
  SOLUTION_PATH: 'JSdotNet.AppDefaults.slnx'
  DEFAULTS_PROJECT_PATH: 'src/JSdotNet.AppDefaults.Mcp/JSdotNet.AppDefaults.Mcp.csproj'
  HOSTING_PROJECT_PATH: 'aspire/integrations/JSdotNet.AppDefaults.Hosting/JSdotNet.AppDefaults.Hosting.csproj'
  # The retired packages: each ships one final notice version (pinned in retired/Directory.Build.props).
  RETIRED_PACKAGE_IDS: 'JSdotNet.MCP.Guidelines JSdotNet.MCP.Design'

permissions:
  contents: write
  packages: write

jobs:

  # 1. Detect which packages have source changes
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      defaults: ${{ steps.filter.outputs.defaults }}
      hosting: ${{ steps.filter.outputs.hosting }}
      retired: ${{ steps.filter.outputs.retired }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ inputs.since }}
          filters: |
            defaults:
              - 'src/JSdotNet.MCP.Shared/**'
              - 'src/JSdotNet.AppDefaults.Mcp/**'
            hosting:
              - 'aspire/integrations/**'
            retired:
              - 'retired/**'

  # 2. Build, test and pack (always runs)
  build-test:
    name: Build, Test and Pack
    runs-on: ubuntu-latest
    needs: [detect-changes]
    outputs:
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
      preReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}
      sha: ${{ steps.gitversion.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.4.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "AppDefaults changed: ${{ needs.detect-changes.outputs.defaults }}"

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.fullSemVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true

      - name: Run tests
        run: |
          for project in \
            tests/JSdotNet.MCP.Shared.Tests/JSdotNet.MCP.Shared.Tests.csproj \
            tests/JSdotNet.AppDefaults.Hosting.Tests/JSdotNet.AppDefaults.Hosting.Tests.csproj \
            tests/JSdotNet.AppDefaults.Mcp.Tests/JSdotNet.AppDefaults.Mcp.Tests.csproj; do
            project_name="$(basename "$(dirname "$project")")"
            dotnet test "$project" --configuration Release --no-build --verbosity normal --results-directory "./coverage/$project_name" -- \
              --coverlet \
              --coverlet-output-format cobertura \
              --coverlet-exclude "[*.Tests]*" \
              --coverlet-include "[JSdotNet.*]*" \
              --coverlet-exclude "[*]*.Program" \
              --coverlet-exclude "[*]*GitHubDocumentCatalog" \
              --coverlet-exclude-by-attribute Obsolete \
              --coverlet-exclude-by-attribute GeneratedCode \
              --coverlet-exclude-by-attribute CompilerGenerated \
              --coverlet-include-directory "$PWD/src" \
              --coverlet-include-directory "$PWD/aspire/integrations"
          done
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true

      - name: Merge coverage reports
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.*.xml" \
            -targetdir:"./coverage-merged" \
            -reporttypes:Cobertura \
            -assemblyfilters:"+JSdotNet.*;-*.Tests"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage-merged/Cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '80 90'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Pack NuGet packages
        run: |
          mkdir -p ./artifacts
          for project in "${{ env.DEFAULTS_PROJECT_PATH }}" "${{ env.HOSTING_PROJECT_PATH }}"; do
            dotnet pack "$project" --configuration Release --no-build --output ./artifacts /p:PackageVersion=${{ steps.gitversion.outputs.fullSemVer }} /p:Version=${{ steps.gitversion.outputs.fullSemVer }}
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ steps.gitversion.outputs.fullSemVer }}
          path: ./artifacts/*.nupkg
          retention-days: 7

      # Packed apart and without the GitVersion properties: the notice version is pinned, and
      # these packages stay out of the GitHub release.
      - name: Pack retired notice packages
        run: |
          for id in ${{ env.RETIRED_PACKAGE_IDS }}; do
            dotnet pack "retired/$id/$id.csproj" --configuration Release --output ./artifacts-retired
          done

      - name: Upload retired notice packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-retired-${{ steps.gitversion.outputs.fullSemVer }}
          path: ./artifacts-retired/*.nupkg
          retention-days: 7

  # 3. Publish AppDefaults (only when its source changed)
  publish-defaults:
    name: Publish MCP server
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    permissions:
      contents: read
      id-token: write
    if: |
      needs.detect-changes.outputs.defaults == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.since == '')
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-${{ needs.build-test.outputs.fullSemVer }}
          path: ./artifacts

      - name: Log in to NuGet.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: JSdotNet

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/JSdotNet.AppDefaults.Mcp.*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Write deployment summary
        run: |
          echo "## JSdotNet.AppDefaults.Mcp published" >> $GITHUB_STEP_SUMMARY
          echo "| Version | NuGet |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ needs.build-test.outputs.fullSemVer }} | [View on NuGet.org](https://www.nuget.org/packages/JSdotNet.AppDefaults.Mcp/${{ needs.build-test.outputs.fullSemVer }}) |" >> $GITHUB_STEP_SUMMARY

  # 3b. Publish the Aspire hosting integration the config source lists (only when it changed)
  publish-hosting:
    name: Publish Aspire hosting
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    permissions:
      contents: read
      id-token: write
    if: |
      needs.detect-changes.outputs.hosting == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.since == '')
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-${{ needs.build-test.outputs.fullSemVer }}
          path: ./artifacts

      - name: Log in to NuGet.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: JSdotNet

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/JSdotNet.AppDefaults.Hosting.*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  # 3c. Publish the final notice version of each retired package and unlist its earlier
  #     versions (when retired/ changed, or on a dispatch without `since`). Pushing is idempotent (--skip-duplicate).
  publish-retired:
    name: Publish retired notices
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    permissions:
      contents: read
      id-token: write
    if: |
      needs.detect-changes.outputs.retired == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.since == '')
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download retired notice packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-retired-${{ needs.build-test.outputs.fullSemVer }}
          path: ./artifacts-retired

      - name: Log in to NuGet.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: JSdotNet

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts-retired/*.nupkg"             --api-key "$NUGET_API_KEY"             --source https://api.nuget.org/v3/index.json             --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # Best effort: a trusted-publishing key may lack the unlist scope. Every version this step
      # cannot unlist is listed in the run summary for unlisting on nuget.org by hand.
      - name: Unlist earlier versions
        continue-on-error: true
        run: |
          echo "## Retired packages" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version | Unlisted |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          failed=0
          for id in ${{ env.RETIRED_PACKAGE_IDS }}; do
            notice=$(basename ./artifacts-retired/$id.[0-9]*.nupkg .nupkg); notice=${notice#"$id."}
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            for version in $(curl -fsSL "https://api.nuget.org/v3-flatcontainer/$lower/index.json" | jq -r '.versions[]'); do
              [ "$version" = "$notice" ] && continue
              if dotnet nuget delete "$id" "$version"                   --source https://api.nuget.org/v3/index.json                   --api-key "$NUGET_API_KEY"                   --non-interactive; then
                echo "| $id | $version | yes |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $id | $version | **no: unlist on nuget.org** |" >> $GITHUB_STEP_SUMMARY
                failed=1
              fi
            done
          done
          exit $failed
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  # 4. GitHub Release (only when at least one package was published)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-test, publish-defaults, publish-hosting]
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      (needs.publish-defaults.result == 'success' || needs.publish-hosting.result == 'success')
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-${{ needs.build-test.outputs.fullSemVer }}
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-test.outputs.semVer }}
          name: Release v${{ needs.build-test.outputs.semVer }}
          files: ./artifacts/*.nupkg
          draft: false
          prerelease: ${{ needs.build-test.outputs.preReleaseLabel != '' }}
          body: |
            ## JSdotNet App Defaults ${{ needs.build-test.outputs.fullSemVer }}

            ### Published packages
            ${{ needs.publish-defaults.result == 'success' && format('- **JSdotNet.AppDefaults.Mcp** [{0}](https://www.nuget.org/packages/JSdotNet.AppDefaults.Mcp/{0})', needs.build-test.outputs.fullSemVer) || '- JSdotNet.AppDefaults.Mcp - not updated' }}
            ${{ needs.publish-hosting.result == 'success' && format('- **JSdotNet.AppDefaults.Hosting** [{0}](https://www.nuget.org/packages/JSdotNet.AppDefaults.Hosting/{0})', needs.build-test.outputs.fullSemVer) || '- JSdotNet.AppDefaults.Hosting - not updated' }}

            ### Build info
            | | |
            |---|---|
            | **Full SemVer** | ${{ needs.build-test.outputs.fullSemVer }} |
            | **Commit** | ${{ needs.build-test.outputs.sha }} |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Report pipeline failure as a GitHub issue
  report-failure:
    name: Report Pipeline Failure
    needs: [build-test, publish-defaults, publish-hosting, publish-retired, create-release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue (skip if open issue exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BODY: |
            ## Pipeline Failure: ${{ github.workflow }}

            | | |
            |---|---|
            | **Workflow** | ${{ github.workflow }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Branch** | ${{ github.ref_name }} |
            | **Commit** | ${{ github.sha }} |
            | **Triggered by** | ${{ github.actor }} |

            Please [inspect the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
        run: |
          EXISTING=$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --label "bug" \
            --search "Pipeline failure: ${{ github.workflow }} in:title" \
            --json number \
            --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open failure issue already exists for this workflow — skipping."
            exit 0
          fi
          echo "$BODY" | gh issue create \
            --repo "$GH_REPO" \
            --title "Pipeline failure: ${{ github.workflow }}" \
            --body-file - \
            --label "bug"