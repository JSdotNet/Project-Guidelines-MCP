name: Build, Test and Publish to NuGet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'JSdotNet.MCP.slnx'
  GUIDELINES_PROJECT_PATH: 'src/JSdotNet.MCP.Guidelines/JSdotNet.MCP.Guidelines.csproj'
  DESIGN_PROJECT_PATH: 'src/JSdotNet.MCP.Design/JSdotNet.MCP.Design.csproj'

permissions:
  contents: write
  packages: write

jobs:

  # 1. Detect which packages have source changes
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      guidelines: ${{ steps.filter.outputs.guidelines }}
      design: ${{ steps.filter.outputs.design }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            guidelines:
              - 'src/JSdotNet.MCP.Shared/**'
              - 'src/JSdotNet.MCP.Guidelines/**'
            design:
              - 'src/JSdotNet.MCP.Shared/**'
              - 'src/JSdotNet.MCP.Design/**'

  # 2. Build, test and pack (always runs)
  build-test:
    name: Build, Test and Pack
    runs-on: ubuntu-latest
    needs: [detect-changes]
    outputs:
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
      preReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}
      sha: ${{ steps.gitversion.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.4.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Guidelines changed: ${{ needs.detect-changes.outputs.guidelines }}"
          echo "Design changed: ${{ needs.detect-changes.outputs.design }}"

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.fullSemVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true

      - name: Run tests
        run: |
          for project in \
            tests/JSdotNet.MCP.Shared.Tests/JSdotNet.MCP.Shared.Tests.csproj \
            tests/JSdotNet.MCP.Design.Tests/JSdotNet.MCP.Design.Tests.csproj; do
            dotnet test "$project" --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverlet.runsettings
          done
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '80 90'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Pack NuGet packages
        run: |
          mkdir -p ./artifacts
          for project in "${{ env.GUIDELINES_PROJECT_PATH }}" "${{ env.DESIGN_PROJECT_PATH }}"; do
            dotnet pack "$project" --configuration Release --no-build --output ./artifacts /p:PackageVersion=${{ steps.gitversion.outputs.fullSemVer }} /p:Version=${{ steps.gitversion.outputs.fullSemVer }}
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ steps.gitversion.outputs.fullSemVer }}
          path: ./artifacts/*.nupkg
          retention-days: 7

  # 3a. Publish Guidelines (only when its source changed)
  publish-guidelines:
    name: Publish JSdotNet.MCP.Guidelines
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    if: |
      needs.detect-changes.outputs.guidelines == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-${{ needs.build-test.outputs.fullSemVer }}
          path: ./artifacts

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/JSdotNet.MCP.Guidelines.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Write deployment summary
        run: |
          echo "## JSdotNet.MCP.Guidelines published" >> $GITHUB_STEP_SUMMARY
          echo "| Version | NuGet |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ needs.build-test.outputs.fullSemVer }} | [View on NuGet.org](https://www.nuget.org/packages/JSdotNet.MCP.Guidelines/${{ needs.build-test.outputs.fullSemVer }}) |" >> $GITHUB_STEP_SUMMARY

  # 3b. Publish Design (only when its source changed)
  publish-design:
    name: Publish JSdotNet.MCP.Design
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    if: |
      needs.detect-changes.outputs.design == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-${{ needs.build-test.outputs.fullSemVer }}
          path: ./artifacts

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/JSdotNet.MCP.Design.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Write deployment summary
        run: |
          echo "## JSdotNet.MCP.Design published" >> $GITHUB_STEP_SUMMARY
          echo "| Version | NuGet |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ needs.build-test.outputs.fullSemVer }} | [View on NuGet.org](https://www.nuget.org/packages/JSdotNet.MCP.Design/${{ needs.build-test.outputs.fullSemVer }}) |" >> $GITHUB_STEP_SUMMARY

  # 4. GitHub Release (only when at least one package was published)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-test, publish-guidelines, publish-design]
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      (needs.publish-guidelines.result == 'success' || needs.publish-design.result == 'success')
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-${{ needs.build-test.outputs.fullSemVer }}
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-test.outputs.semVer }}
          name: Release v${{ needs.build-test.outputs.semVer }}
          files: ./artifacts/*.nupkg
          draft: false
          prerelease: ${{ needs.build-test.outputs.preReleaseLabel != '' }}
          body: |
            ## JSdotNet MCP Servers ${{ needs.build-test.outputs.fullSemVer }}

            ### Published packages
            ${{ needs.publish-guidelines.result == 'success' && format('- **JSdotNet.MCP.Guidelines** [{0}](https://www.nuget.org/packages/JSdotNet.MCP.Guidelines/{0})', needs.build-test.outputs.fullSemVer) || '- JSdotNet.MCP.Guidelines - not updated' }}
            ${{ needs.publish-design.result == 'success' && format('- **JSdotNet.MCP.Design** [{0}](https://www.nuget.org/packages/JSdotNet.MCP.Design/{0})', needs.build-test.outputs.fullSemVer) || '- JSdotNet.MCP.Design - not updated' }}

            ### Build info
            | | |
            |---|---|
            | **Full SemVer** | ${{ needs.build-test.outputs.fullSemVer }} |
            | **Commit** | ${{ needs.build-test.outputs.sha }} |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Report pipeline failure as a GitHub issue
  report-failure:
    name: Report Pipeline Failure
    needs: [build-test, publish-guidelines, publish-design, create-release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue (skip if open issue exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BODY: |
            ## Pipeline Failure: ${{ github.workflow }}

            | | |
            |---|---|
            | **Workflow** | ${{ github.workflow }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Branch** | ${{ github.ref_name }} |
            | **Commit** | ${{ github.sha }} |
            | **Triggered by** | ${{ github.actor }} |

            Please [inspect the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
        run: |
          EXISTING=$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --label "bug" \
            --search "Pipeline failure: ${{ github.workflow }} in:title" \
            --json number \
            --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open failure issue already exists for this workflow — skipping."
            exit 0
          fi
          echo "$BODY" | gh issue create \
            --repo "$GH_REPO" \
            --title "Pipeline failure: ${{ github.workflow }}" \
            --body-file - \
            --label "bug"