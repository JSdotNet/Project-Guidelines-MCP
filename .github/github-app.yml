# GitHub Copilot App configuration for Project-Guidelines-MCP
#
# Global repository instructions live in .github/copilot-instructions.md and apply to
# ALL Copilot surfaces (VS Code, GitHub.com, CLI, this App). This file adds behaviour
# that is specific to the GitHub Copilot App — session lifecycle scripts and automation.

instructions: |-
  ## GitHub Copilot App — Session Instructions

  Full repository guidance is in `.github/copilot-instructions.md`; apply it in full.
  The notes below are specific to this App and supplement that file.

  ### MCP Server — Local Docs

  The session setup script installs the `jsdotnet-coding-guidelines` MCP server tool.
  Set JSDOTNET_DOCS_PATH to the absolute path of the `docs/` folder in the current
  worktree so the server reads local docs instead of fetching from GitHub.

  ### Pull Requests

  This App creates PRs autonomously. Every PR must be opened against the
  **JSdotNet** GitHub organization account. Never push directly to `main`.

scripts:
  - name: Install JSdotNet Guidelines MCP Server
    command: dotnet tool install -g JSdotNet.Project.Guidelines.McpServer || dotnet tool update -g JSdotNet.Project.Guidelines.McpServer
    triggers:
      - session.create

automation:
  auto_issue_session: true
  remote_control: false
