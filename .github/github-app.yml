# GitHub Copilot App configuration for Project-Guidelines-MCP
#
# Global repository instructions live in .github/copilot-instructions.md and apply to
# ALL Copilot surfaces (VS Code, GitHub.com, CLI, this App). This file adds behaviour
# that is specific to the GitHub Copilot App — session lifecycle scripts and automation.

instructions: |-
  ## GitHub Copilot App — Session Instructions

  Full repository guidance is in `.github/copilot-instructions.md`; apply it in full.
  The notes below are specific to this App and supplement that file.

  ### MCP Server

  The `jsdotnet-coding-guidelines` MCP server is available in this session.
  Always use it to query guidelines before answering any architectural or coding question.

  ### Pull Requests

  PRs are created only when the user explicitly requests it (via the "Create PR" button).
  When creating a PR, always use the **JSdotNet** GitHub organization account.

automation:
  auto_issue_session: true
  remote_control: false
