# GitHub Copilot App configuration for Project-Guidelines-MCP
# Guideline source: jsdotnet.project.guidelines.mcpserver

# --- Pre-PR Validation ---
# Build the solution to catch compilation errors before opening a PR.
pre_flight:
  - name: Build solution
    run: dotnet build JSdotNet.Project.Guidelines.slnx --no-incremental
    shell: pwsh

# --- Post-PR: Pipeline Monitoring ---
# Wait 5 minutes after PR creation before checking CI to allow all checks to trigger.
# On failure: diagnose, fix, push a corrective commit, and re-check. Retry up to 3 times.
# Do not force-push; use regular commits so reviewers can follow the correction history.
on_pr_opened:
  - name: Wait for CI to start
    wait: 5m

  - name: Check pipeline status
    action: check_ci
    on_failure: fix_and_push

  - name: Wait for initial review
    wait: 5m

  - name: Process review comments
    action: address_review_comments

# --- PR Conventions ---
pr_conventions:
  # Title must follow Conventional Commits: <type>(<optional-scope>): <short imperative summary>
  # Allowed types: feat, fix, refactor, test, docs, chore, perf, ci, build
  title_format: "<type>(<optional-scope>): <short imperative summary>"

  # Branch naming: <type>/<short-slug>
  branch_format: "<type>/<short-slug>"

  # PR description must be populated with this template
  description_template: |
    ## Summary
    <!-- What does this PR do and why? -->

    ## Changes
    <!-- Bullet list of notable changes -->

    ## Testing
    <!-- How was this tested? Reference test files or test results. -->

    ## Related
    <!-- Issue refs, ADR refs, or links -->

# --- GitHub & Git Account Management ---
automation:
  auto_issue_session: false
  remote_control: false

instructions:
  github_account: "Use the JSdotNet repository account for all GitHub operations in this repo."
  gh_cli: |
    The correct gh account for this repo is JSdotNet (stored in the keyring).
    GH_TOKEN may be set in the environment and will override the keyring account, causing all GitHub API operations to fail with 403.
    Before running ANY gh command (pr create, pr merge, issue create, api calls, etc.), execute these two steps in order:
      1. Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
      2. gh auth switch --user JSdotNet
  git_transport: "Use the repository SSH remote/account for push, pull, fetch, and clone operations."
  mcp_server: "Use jsdotnet-project-guidelines-mcpserver when working on code in src/. Do not query it when editing docs/ — those files are the source content the server serves."

# --- Scope & Safety Boundaries ---
# The agent IS permitted to:
#   - Create and push commits on its own branch.
#   - Open, update, and comment on PRs.
#   - Run build and test commands listed in this file.
#   - Propose code changes in response to review comments.
#
# The agent is NOT permitted to:
#   - Merge PRs without a human-approved review.
#   - Delete branches other than its own short-lived ones.
#   - Modify .github/ or infrastructure-as-code files without an explicit human instruction.
#   - Push directly to main or any protected branch.
#   - Access, log, or store secrets — always use repository or environment secrets
#     via secrets.* references.

# --- Secrets & Environment Variables ---
# - Never hard-code credentials or tokens in code or config files.
# - Reference secrets exclusively via ${{ secrets.SECRET_NAME }} in workflow files.
# - If a required secret is missing, fail loudly with a clear error message.
